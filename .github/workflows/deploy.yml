name: Deploy

# main        -> dev project, automatically after tests pass
# tag v*.*.*  -> production project, only when you push a version tag
#
# Production credentials can only be issued to tag builds: the production
# Workload Identity provider only trusts refs/tags/v*. A push to main
# cannot deploy production even if this file is edited.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}
      PROJECT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_FIREBASE_PROJECT_ID || vars.DEV_FIREBASE_PROJECT_ID }}
      WIF_PROVIDER: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_WIF_PROVIDER || vars.DEV_WIF_PROVIDER }}
      DEPLOY_SA: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_DEPLOY_SA || vars.DEV_DEPLOY_SA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json

      - name: Check configuration
        run: |
          for v in PROJECT_ID WIF_PROVIDER DEPLOY_SA; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable for $v ($TARGET) is not set"; exit 1; fi
          done

      - name: Write web config (public Firebase web config, not secrets)
        working-directory: web
        run: |
          cat > .env.production <<EOF
          VITE_FB_API_KEY=${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_FB_API_KEY || vars.DEV_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN=${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_FB_AUTH_DOMAIN || vars.DEV_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID=${PROJECT_ID}
          VITE_FB_STORAGE_BUCKET=${PROJECT_ID}.firebasestorage.app
          VITE_FB_MESSAGING_SENDER_ID=${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_FB_MESSAGING_SENDER_ID || vars.DEV_FB_MESSAGING_SENDER_ID }}
          VITE_FB_APP_ID=${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_FB_APP_ID || vars.DEV_FB_APP_ID }}
          VITE_FB_VAPID_KEY=${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_FB_VAPID_KEY || vars.DEV_FB_VAPID_KEY }}
          VITE_FUNCTIONS_REGION=asia-south1
          EOF

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Install functions
        working-directory: functions
        run: npm ci

      - name: Write function params
        env:
          APP_URL_VAR: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_APP_URL || vars.DEV_APP_URL }}
          AI_MODEL_VAR: ${{ vars.AI_MODEL }}
          EMAIL_FROM_VAR: ${{ vars.EMAIL_FROM }}
          APP_CHECK_VAR: ${{ vars.ENFORCE_APP_CHECK }}
        run: |
          if [ "$TARGET" = prod ]; then DEFAULT_URL=https://bb.jay.im; else DEFAULT_URL="https://${PROJECT_ID}.web.app"; fi
          cat > "functions/.env.${PROJECT_ID}" <<EOF
          AI_MODEL="${AI_MODEL_VAR:-claude-sonnet-5-5}"
          EMAIL_FROM="${EMAIL_FROM_VAR:-Black Notebook <no-reply@jay.im>}"
          APP_URL="${APP_URL_VAR:-$DEFAULT_URL}"
          ENFORCE_APP_CHECK="${APP_CHECK_VAR:-false}"
          EOF

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Deploy hosting, rules and functions
        run: npx -y firebase-tools@15 deploy --project "$PROJECT_ID" --only hosting,firestore,functions --non-interactive --force

      - name: Summary
        run: |
          echo "### Deployed to $TARGET ($PROJECT_ID)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA::7}  Ref: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      all: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /functions
    schedule: { interval: weekly }
    groups:
      all: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /rules-tests
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
